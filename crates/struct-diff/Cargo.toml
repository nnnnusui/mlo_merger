[package]
name = "struct-diff"
version = "0.1.0"
edition = "2024"
description = "Typed, recursive struct differences generated by a derive macro"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
struct-diff-derive = { path = "../struct-diff-derive" }

[dev-dependencies]
serde_json = "1.0.154"
trybuild = "1"

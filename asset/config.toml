# FiveM game builds for --gamebuild: the builds FiveM's launcher supports
# (code/client/launcher/GameCache.cpp) and the names sv_enforceGameBuild accepts for them
# (code/components/citizen-server-impl/include/GameBuilds.h).
# Each build lists the DLC packs it first includes, FiveM's name for the build first. A build
# includes the stages from its first DLC found in dlclist.xml up to the stage before the next
# build's; a build without DLCs includes what the build before it does, and build 1 stops at
# the title update. --gamebuild takes a build number or a listed DLC, spelled as FiveM accepts
# it (xm18, h4 and sum mean mpchristmas2018, mpheist4 and mpsum); a number missing here uses
# the closest build below it. FiveM's name for a build without DLCs, such as mp2026_patch_01
# for 3788, is not accepted; give its number.
[gamebuild]
1 = []
1604 = ["mpchristmas2018"]
# The Diamond Casino & Resort and its heist have no FiveM build; 2060 first includes them.
2060 = ["mpsum", "mpvinewood", "mpheist3"]
2189 = ["mpheist4"]
2372 = ["mptuner"]
2545 = ["mpsecurity"]
2612 = ["mpg9ec"]
2699 = ["mpsum2"]
2802 = ["mpchristmas3"]
2944 = ["mp2023_01"]
3095 = ["mp2023_02"]
3179 = []
3258 = ["mp2024_01"]
3323 = []
3407 = ["mp2024_02"]
3570 = ["mp2025_01"]
3751 = ["mp2025_02"]
3788 = []
3889 = ["mp2026_01"]

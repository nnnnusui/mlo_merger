# Tolerances for comparing sources with vanilla. Tools round values differently when they save
# a file (CodeWalker and OpenIV, for example, write the same position with slightly different
# digits), so values a resource never touched can differ from vanilla by that rounding alone.
# Differences within these tolerances are treated as no change, so such values are not
# detected or merged as changes. Position tolerances end in _position.
[tolerance]
# YBN polygon coordinates and radii, per axis, in metres.
ybn_position = 0.05
# YMAP float values: entity positions, rotations, scales and LOD distances, and car generator,
# time-cycle modifier and distant LOD light values.
ymap = 0.001
# XY extents of occlude models, in metres, when pairing them.
ymap_occlude_model_position = 0.01
# Box occluder centers, in stored units (a quarter metre).
ymap_box_occluder_position = 1
# Box occluder rotation (iCosZ/iSinZ), in stored units.
ymap_box_occluder_rotation = 1
# Decimal places car generator and distant LOD light positions are rounded to when pairing.
ymap_car_generator_position_decimals = 3
ymap_lod_light_position_decimals = 3
# Grass instance positions, per axis, in metres.
ymap_grass_position = 0.01

# FiveM game builds for --gamebuild: the builds FiveM's launcher supports
# (code/client/launcher/GameCache.cpp) and the names sv_enforceGameBuild accepts for them
# (code/components/citizen-server-impl/include/GameBuilds.h).
# Each build lists the DLC packs it first includes, FiveM's name for the build first. A build
# includes the stages from its first DLC found in dlclist.xml up to the stage before the next
# build's; a build without DLCs includes what the build before it does, and build 1 stops at
# the title update. --gamebuild takes a build number or a listed DLC, spelled as FiveM accepts
# it (xm18, h4 and sum mean mpchristmas2018, mpheist4 and mpsum); a number missing here uses
# the closest build below it. FiveM's name for a build without DLCs, such as mp2026_patch_01
# for 3788, is not accepted; give its number.
[gamebuild]
1 = []
1604 = ["mpchristmas2018"]
# The Diamond Casino & Resort and its heist have no FiveM build; 2060 first includes them.
2060 = ["mpsum", "mpvinewood", "mpheist3"]
2189 = ["mpheist4"]
2372 = ["mptuner"]
2545 = ["mpsecurity"]
2612 = ["mpg9ec"]
2699 = ["mpsum2"]
2802 = ["mpchristmas3"]
2944 = ["mp2023_01"]
3095 = ["mp2023_02"]
3179 = []
3258 = ["mp2024_01"]
3323 = []
3407 = ["mp2024_02"]
3570 = ["mp2025_01"]
3751 = ["mp2025_02"]
3788 = []
3889 = ["mp2026_01"]

# Blacklist configuration for mlo_merger
# This file allows you to filter out specific occlude models from being added during merge

# Example: cfx-gabz-mapdata sp1_occl_01 occlude_model (mba)
[[occlude_models]]
bmin = [-407.08, -2047.73, 14.22]

# You can also specify bmax to match occlude models
# [[occlude_models]]
# bmax = [100.0, 200.0, 300.0]

# Or match both bmin and bmax
# [[occlude_models]]
# bmin = [-407.08, -2047.73, 14.22]
# bmax = [-397.08, -2037.73, 24.22]

# Add more entries as needed
# [[occlude_models]]
# bmin = [x, y, z]

name: Build and release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  notices:
    name: Collect third-party notices
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install cargo-about
        run: cargo install --locked cargo-about --version 0.9.3 --features cli

      - name: Generate third-party notices
        run: |
          # One run per release target; keep in sync with the build matrix. wasm32 is the
          # browser build in mlo_merger-all's web/.
          for target in x86_64-pc-windows-msvc x86_64-unknown-linux-gnu aarch64-apple-darwin wasm32-unknown-unknown; do
            cargo about generate --locked --fail --format json --target "$target" -o "about-$target.json"
          done
          mkdir notices
          python3 scripts/third_party_notices.py about-*.json \
            -o notices/third_party_notices.json --markdown notices/THIRD_PARTY_NOTICES.md

      - name: Upload notices
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: third-party-notices
          path: notices/*
          if-no-files-found: error
          retention-days: 7

  types:
    name: Generate TypeScript bindings
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      # The bindings describe the JSON every platform's executable reads and writes, so one run
      # serves every archive.
      - name: Generate TypeScript bindings
        run: cargo run --locked --features typescript --bin export-types

      - name: Upload TypeScript bindings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: typescript-bindings
          path: asset/gen_mlo_merger.ts
          if-no-files-found: error
          retention-days: 7

  web:
    name: Build the browser build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BINARYEN_VERSION: version_133
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli and binaryen
        run: |
          version=$(sed -n '/^name = "wasm-bindgen"$/{n;s/^version = "\(.*\)"$/\1/p;}' Cargo.lock)
          cargo install --locked wasm-bindgen-cli --version "$version"
          archive="binaryen-$BINARYEN_VERSION-x86_64-linux.tar.gz"
          url="https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN_VERSION/$archive"
          curl -fsSLO "$url"
          curl -fsSL "$url.sha256" | sha256sum -c -
          tar xzf "$archive"
          echo "$PWD/binaryen-$BINARYEN_VERSION/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          scripts/build_web.sh --bundle web-build/web
          version=$(wasm-bindgen --version | cut -d' ' -f2)
          printf '{"target": "web", "version": "%s"}\n' "$version" > web-build/wasm_bindgen.json

      - name: Test
        run: node scripts/test_web.mjs web-build/web

      - name: Upload browser build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: web
          path: web-build/
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build ${{ matrix.target }}
    needs: [notices, types]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: mlo_merger.exe
            archive: zip
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            executable: mlo_merger
            archive: gztar
          - os: macos-15
            target: aarch64-apple-darwin
            executable: mlo_merger
            archive: gztar
    env:
      TARGET: ${{ matrix.target }}
      EXECUTABLE: ${{ matrix.executable }}
      ARCHIVE_FORMAT: ${{ matrix.archive }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "$TARGET"

      - name: Build executable
        run: cargo build --locked --release --bin mlo_merger --target "$TARGET"

      - name: Check executable
        run: '"target/$TARGET/release/$EXECUTABLE" --help'

      - name: Download third-party notices
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: third-party-notices
          path: notices

      - name: Download TypeScript bindings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: typescript-bindings
          path: asset

      - name: Package executable
        run: |
          python_command=python3
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python_command=python
          fi
          cargo metadata --locked --no-deps --format-version 1 > cargo-metadata.json
          "$python_command" - <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil

          target = os.environ["TARGET"]
          name = f"mlo_merger-{target}"
          package = Path("package") / name
          package.mkdir(parents=True)
          shutil.copy2(Path("target") / target / "release" / os.environ["EXECUTABLE"], package)
          metadata = json.loads(Path("cargo-metadata.json").read_text(encoding="utf-8"))
          (crate,) = (crate for crate in metadata["packages"] if crate["name"] == "mlo_merger")
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{crate['version']}":
              raise SystemExit(f"Tag {tag} does not match Cargo.toml version {crate['version']}")
          repository = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
          release = {
              "name": crate["name"],
              "version": crate["version"],
              "tag": tag,
              "commit": os.environ["GITHUB_SHA"],
              "repository": repository,
              "release_url": f"{repository}/releases/tag/{tag}",
              "targets": [target],
          }
          (package / "release.json").write_text(json.dumps(release, indent=2) + "\n", encoding="utf-8")
          for filename in ("Readme.md", "LICENSE.md", "asset/config.toml",
                           "docs/ARCHITECTURE.md", "docs/TODO.md", "docs/usage.md",
                           "docs/reference.md", "docs/development.md", "docs/web.md",
                           ".cargo/config.toml", "asset/gen_mlo_merger.ts"):
              destination = package / filename
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(filename, destination)
          for filename in ("third_party_notices.json", "THIRD_PARTY_NOTICES.md"):
              shutil.copy2(Path("notices") / filename, package)
          Path("dist").mkdir()
          shutil.make_archive(str(Path("dist") / name), os.environ["ARCHIVE_FORMAT"],
                              root_dir="package", base_dir=name)
          PY

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish release
    # Without the browser build there is no mlo_merger-all, so nothing is released.
    needs: [build, web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Download browser build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: web
          path: web-build

      - name: Package all platforms
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import shutil
          import tempfile

          platforms = {
              "x86_64-pc-windows-msvc": "windows",
              "x86_64-unknown-linux-gnu": "linux",
              "aarch64-apple-darwin": "macos-arm64",
          }
          dist = Path("dist")
          archives = sorted(dist.glob("mlo_merger-*.zip")) + sorted(dist.glob("mlo_merger-*.tar.gz"))
          if not archives:
              raise SystemExit("No platform archives to combine")
          name = "mlo_merger-all"
          with tempfile.TemporaryDirectory() as temporary:
              package = Path(temporary) / name
              package.mkdir()
              release = None
              targets = []
              for archive in archives:
                  extracted = Path(temporary) / "extracted" / archive.name
                  shutil.unpack_archive(archive, extracted)
                  (root,) = extracted.iterdir()
                  platform = platforms[root.name.removeprefix("mlo_merger-")]
                  # Every platform's release.json describes the same build but its own target.
                  own = json.loads((root / "release.json").read_text(encoding="utf-8"))
                  targets += own.pop("targets")
                  if release is None:
                      release = own
                  elif own != release:
                      raise SystemExit(f"{archive.name} was built from another release")
                  for path in sorted(root.rglob("*")):
                      if not path.is_file():
                          continue
                      relative = path.relative_to(root)
                      if relative == Path("release.json"):
                          continue
                      if relative.name in ("mlo_merger", "mlo_merger.exe") and len(relative.parts) == 1:
                          destination = package / f"mlo_merger-{platform}{relative.suffix}"
                      else:
                          destination = package / relative
                          if destination.exists():
                              continue
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(path, destination)
              release["targets"] = sorted(targets)
              # The browser build; see docs/web.md.
              web = Path("web-build/web")
              if not (web / "pkg" / "mlo_merger_web_bg.wasm").is_file():
                  raise SystemExit("The browser build is missing")
              shutil.copytree(web, package / "web")
              release["web"] = {
                  "wasm_bindgen": json.loads(Path("web-build/wasm_bindgen.json").read_text(encoding="utf-8")),
                  "files": {
                      path.relative_to(package / "web").as_posix():
                          hashlib.sha256(path.read_bytes()).hexdigest()
                      for path in sorted((package / "web").rglob("*")) if path.is_file()
                  },
              }
              (package / "release.json").write_text(json.dumps(release, indent=2) + "\n", encoding="utf-8")
              shutil.make_archive(str(dist / name), "zip", root_dir=temporary, base_dir=name)
          PY

      - name: Generate checksums
        run: |
          cd dist
          sha256sum mlo_merger-*.zip mlo_merger-*.tar.gz > SHA256SUMS

      - name: Create or update release
        run: |
          release_flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
              --title "$RELEASE_TAG" --draft "${release_flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false

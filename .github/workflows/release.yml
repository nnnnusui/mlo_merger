name: Build and release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: mlo_merger.exe
            archive: zip
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            executable: mlo_merger
            archive: gztar
          - os: macos-15-intel
            target: x86_64-apple-darwin
            executable: mlo_merger
            archive: gztar
          - os: macos-15
            target: aarch64-apple-darwin
            executable: mlo_merger
            archive: gztar
    env:
      TARGET: ${{ matrix.target }}
      EXECUTABLE: ${{ matrix.executable }}
      ARCHIVE_FORMAT: ${{ matrix.archive }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "$TARGET"

      - name: Build executable
        run: cargo build --locked --release --bin mlo_merger --target "$TARGET"

      - name: Generate TypeScript bindings
        run: cargo run --locked --features typescript --bin export-types

      - name: Check executable
        run: '"target/$TARGET/release/$EXECUTABLE" --help'

      - name: Package executable
        run: |
          python_command=python3
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python_command=python
          fi
          cargo metadata --locked --no-deps --format-version 1 > cargo-metadata.json
          "$python_command" - <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil

          target = os.environ["TARGET"]
          name = f"mlo_merger-{target}"
          package = Path("package") / name
          package.mkdir(parents=True)
          shutil.copy2(Path("target") / target / "release" / os.environ["EXECUTABLE"], package)
          metadata = json.loads(Path("cargo-metadata.json").read_text(encoding="utf-8"))
          (crate,) = (crate for crate in metadata["packages"] if crate["name"] == "mlo_merger")
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{crate['version']}":
              raise SystemExit(f"Tag {tag} does not match Cargo.toml version {crate['version']}")
          repository = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
          release = {
              "name": crate["name"],
              "version": crate["version"],
              "tag": tag,
              "commit": os.environ["GITHUB_SHA"],
              "repository": repository,
              "release_url": f"{repository}/releases/tag/{tag}",
              "targets": [target],
          }
          (package / "release.json").write_text(json.dumps(release, indent=2) + "\n", encoding="utf-8")
          for filename in ("Readme.md", "LICENSE.md", "asset/config.toml",
                           "docs/ARCHITECTURE.md", "docs/TODO.md", "docs/usage.md",
                           ".cargo/config.toml", "asset/gen_mlo_merger.ts"):
              destination = package / filename
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(filename, destination)
          Path("dist").mkdir()
          shutil.make_archive(str(Path("dist") / name), os.environ["ARCHIVE_FORMAT"],
                              root_dir="package", base_dir=name)
          PY

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Package all platforms
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import shutil
          import tempfile

          platforms = {
              "x86_64-pc-windows-msvc": "windows",
              "x86_64-unknown-linux-gnu": "linux",
              "x86_64-apple-darwin": "macos-x86_64",
              "aarch64-apple-darwin": "macos-arm64",
          }
          dist = Path("dist")
          archives = sorted(dist.glob("mlo_merger-*.zip")) + sorted(dist.glob("mlo_merger-*.tar.gz"))
          if not archives:
              raise SystemExit("No platform archives to combine")
          name = "mlo_merger-all"
          with tempfile.TemporaryDirectory() as temporary:
              package = Path(temporary) / name
              package.mkdir()
              release = None
              targets = []
              for archive in archives:
                  extracted = Path(temporary) / "extracted" / archive.name
                  shutil.unpack_archive(archive, extracted)
                  (root,) = extracted.iterdir()
                  platform = platforms[root.name.removeprefix("mlo_merger-")]
                  # Every platform's release.json describes the same build but its own target.
                  own = json.loads((root / "release.json").read_text(encoding="utf-8"))
                  targets += own.pop("targets")
                  if release is None:
                      release = own
                  elif own != release:
                      raise SystemExit(f"{archive.name} was built from another release")
                  for path in sorted(root.rglob("*")):
                      if not path.is_file():
                          continue
                      relative = path.relative_to(root)
                      if relative == Path("release.json"):
                          continue
                      if relative.name in ("mlo_merger", "mlo_merger.exe") and len(relative.parts) == 1:
                          destination = package / f"mlo_merger-{platform}{relative.suffix}"
                      else:
                          destination = package / relative
                          if destination.exists():
                              continue
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(path, destination)
              release["targets"] = sorted(targets)
              (package / "release.json").write_text(json.dumps(release, indent=2) + "\n", encoding="utf-8")
              shutil.make_archive(str(dist / name), "zip", root_dir=temporary, base_dir=name)
          PY

      - name: Generate checksums
        run: |
          cd dist
          sha256sum mlo_merger-*.zip mlo_merger-*.tar.gz > SHA256SUMS

      - name: Create or update release
        run: |
          release_flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
              --title "$RELEASE_TAG" --draft "${release_flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false

name: Build and release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  # Fails a mistagged release in seconds, before any build, and hands every job the targets.
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check the tag against Cargo.toml
        run: python3 scripts/package_release.py check "$GITHUB_REF_NAME"

      - name: Read the release targets
        id: targets
        run: echo "targets=$(jq -c . .github/release-targets.json)" >> "$GITHUB_OUTPUT"

  notices:
    name: Collect third-party notices
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Install cargo-about
        run: cargo install --locked cargo-about --version 0.9.3 --features cli

      - name: Generate third-party notices
        run: |
          # One run per release target, and wasm32 for the browser build in mlo_merger-all's web/.
          for target in $(jq -r '.[].target' .github/release-targets.json) wasm32-unknown-unknown; do
            cargo about generate --locked --fail --format json --target "$target" -o "about-$target.json"
          done
          mkdir notices
          python3 scripts/third_party_notices.py about-*.json \
            -o notices/third_party_notices.json --markdown notices/THIRD_PARTY_NOTICES.md

      - name: Upload notices
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: third-party-notices
          path: notices/*
          if-no-files-found: error
          retention-days: 7

  types:
    name: Generate TypeScript bindings
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      # The bindings describe the JSON every platform's executable reads and writes, so one run
      # serves every archive.
      - name: Generate TypeScript bindings
        run: cargo run --locked --features typescript --bin export-types

      - name: Upload TypeScript bindings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: typescript-bindings
          path: asset/gen_mlo_merger.ts
          if-no-files-found: error
          retention-days: 7

  web:
    name: Build the browser build
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BINARYEN_VERSION: version_133
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli and binaryen
        run: |
          version=$(sed -n '/^name = "wasm-bindgen"$/{n;s/^version = "\(.*\)"$/\1/p;}' Cargo.lock)
          cargo install --locked wasm-bindgen-cli --version "$version"
          archive="binaryen-$BINARYEN_VERSION-x86_64-linux.tar.gz"
          url="https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN_VERSION/$archive"
          curl -fsSLO "$url"
          curl -fsSL "$url.sha256" | sha256sum -c -
          tar xzf "$archive"
          echo "$PWD/binaryen-$BINARYEN_VERSION/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          scripts/build_web.sh --bundle web-build/web
          version=$(wasm-bindgen --version | cut -d' ' -f2)
          printf '{"target": "web", "version": "%s"}\n' "$version" > web-build/wasm_bindgen.json

      - name: Test
        run: node scripts/test_web.mjs web-build/web

      - name: Upload browser build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: web
          path: web-build/
          if-no-files-found: error
          retention-days: 7

  # Builds only the executable, so the build starts without waiting for the notices or the
  # bindings; the release job packages it with them.
  build:
    name: Build ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # .github/release-targets.json
        include: ${{ fromJSON(needs.check.outputs.targets) }}
    env:
      TARGET: ${{ matrix.target }}
      EXECUTABLE: ${{ matrix.executable }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - name: Build executable
        run: cargo build --locked --release --bin mlo_merger --target "$TARGET"

      - name: Check executable
        run: '"target/$TARGET/release/$EXECUTABLE" --help'

      - name: Upload executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: executable-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.executable }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    # Without the browser build there is no mlo_merger-all, so nothing is released.
    needs: [check, notices, types, build, web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download executables
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: executable-*
          path: executables

      - name: Download third-party notices
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: third-party-notices
          path: notices

      - name: Download TypeScript bindings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: typescript-bindings
          path: asset

      - name: Package each platform
        env:
          TARGETS: ${{ needs.check.outputs.targets }}
        run: |
          jq -r '.[] | "\(.target) \(.executable)"' <<< "$TARGETS" |
            while read -r target executable; do
              mkdir -p "target/$target/release"
              mv "executables/executable-$target/$executable" "target/$target/release/"
              # Artifacts do not keep the executable bit.
              chmod +x "target/$target/release/$executable"
              python3 scripts/package_release.py platform "$target" "$GITHUB_REF_NAME"
            done

      - name: Download browser build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: web
          path: web-build

      - name: Package all platforms
        run: python3 scripts/package_release.py all

      - name: Generate checksums
        run: |
          cd dist
          sha256sum mlo_merger-*.zip mlo_merger-*.tar.gz > SHA256SUMS

      - name: Create or update release
        run: |
          release_flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
              --title "$RELEASE_TAG" --draft "${release_flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false

[package]
name = "mlo_merger"
version = "5.1.1"
edition = "2024"
default-run = "mlo_merger"
publish = false

[workspace]
members = ["crates/struct-diff", "crates/struct-diff-derive", "crates/web"]

[features]
typescript = ["dep:specta", "struct-diff/specta"]
# Hosts CodeWalker in-process for the round-trip tests; not part of the released executable.
codewalker = ["dep:netcorehost"]

[dependencies]
aes = "0.9.4"
bpaf = "0.9.28"
chrono = { version = "0.4.45", features = ["clock"] }
deku = "0.20.3"
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
globset = "0.4.21"
hex = "0.4"
indexmap = { version = "2.14.2", features = ["serde"] }
netcorehost = { version = "0.22.0", optional = true }
quick-xml = { version = "0.42.0", features = ["serialize", "overlapped-lists"] }
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
specta = { version = "1.0.5", optional = true, features = ["export"] }
struct-diff = { path = "crates/struct-diff" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-tree = { version = "0.4", features = ["time"] }
toml = "1.2.1"
walkdir = "2.5.0"

# The GUI, log files, downloads and terminal progress bars exist only natively.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = "0.37.0"
indicatif = "0.18"
rfd = "0.18.0"
tracing-appender = "0.2"
ureq = "3.5.1"

# The browser build reaches the page's virtual filesystem through `web/vfs.js`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Registry"] }

[[test]]
name = "codewalker_roundtrip"
required-features = ["codewalker"]

[[bin]]
name = "export-types"
path = "src/bin/export_types.rs"
required-features = ["typescript"]

# The browser build (scripts/build_web.sh): smaller downloads over native speed.
[profile.web]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1

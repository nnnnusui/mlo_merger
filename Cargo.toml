[package]
name = "mlo_merger"
version = "2.0.0"
edition = "2024"
default-run = "mlo_merger"

[workspace]
members = ["crates/struct-diff", "crates/struct-diff-derive"]

[features]
typescript = ["dep:specta", "struct-diff/specta"]

[dependencies]
bpaf = "0.9.28"
chrono = { version = "0.4.45", features = ["clock"] }
deku = "0.20.3"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
globset = "0.4.20"
hex = "0.4"
indexmap = { version = "2.14.2", features = ["serde"] }
indicatif = "0.18"
netcorehost = "0.22.0"
quick-xml = { version = "0.42.0", features = ["serialize", "overlapped-lists"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
specta = { version = "1.0.5", optional = true, features = ["export"] }
struct-diff = { path = "crates/struct-diff" }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-tree = { version = "0.4", features = ["time"] }
toml = "1.1.8"
walkdir = "2.5.0"

[build-dependencies]
netcorehost = "0.22.0"

[[bin]]
name = "export-types"
path = "src/bin/export_types.rs"
required-features = ["typescript"]

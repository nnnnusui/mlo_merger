[package]
name = "mlo_merger"
version = "0.1.0"
edition = "2024"

[dependencies]
bpaf = "0.9.22"
chrono = { version = "0.4.43", features = ["clock"] }
deku = "0.20.3"
flate2 = "1.1"
indexmap = "2.7.2"
log = "0.4"
netcorehost = "0.22.0"
quick-xml = { version = "0.39.0", features = ["serialize"] }
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
simplelog = "0.12"
structdiff = { version = "0.7.3", features = ["debug_diffs"] }
toml = "0.9.11"
walkdir = "2.5.0"

[build-dependencies]
netcorehost = "0.22.0"
